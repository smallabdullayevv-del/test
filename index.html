.card img{display:block;width:100%;height:auto;min-height:0;aspect-ratio:1.5;object-fit:cover;border-radius:15px 15px 0 0;transform:none}.card:hover img{transform:none}.card .price,.card .name,.card .desc{display:block;margin-left:14px;margin-right:14px}.card .price{margin-top:13px;padding:0;color:var(--accent);font-size:15px}.card .name{margin-top:8px;font-size:15px;font-weight:800;line-height:1.3}.card .desc{margin-top:6px;padding-bottom:0;font-size:12px;line-height:1.5;-webkit-line-clamp:2}
.modal{border-radius:18px}.modal-main img{border-radius:13px}.close{border-radius:50%;background:#f1f1ed;color:var(--text)}
@media(min-width:1250px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:1100px){.layout{grid-template-columns:205px 1fr;gap:25px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:800px){.topbar{height:auto;padding:10px 14px}.topbar .dot{display:none}.layout{display:block;margin:18px auto 40px;padding:0 12px}.sidebar{position:static;flex-direction:row;align-items:center;overflow-x:auto;padding:0 0 10px;gap:7px}.cat{flex:0 0 auto;padding:6px 12px 6px 6px;background:#fff;border:1px solid var(--line);white-space:nowrap}.cat.active{background:var(--text);border-color:var(--text)}.content{padding-top:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.heading-row{margin:22px 0}.heading-row h1{font-size:24px}}
@media(max-width:520px){.topbar .address{order:3;width:100%;color:var(--text)}.grid{grid-template-columns:1fr}.card{min-height:0;display:block}.card img{height:auto;min-height:0;aspect-ratio:1.55}.card .price{margin-top:13px;font-size:15px}.card .name{font-size:15px}.card .desc{font-size:12px;padding-bottom:0}.heading-row h1{font-size:24px}}
</style>
<link rel="stylesheet" href="kukaldosh.css" />
<script src="menu-data.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><img class="site-logo" src="assets/kukaldosh-logo.png" alt="Kukaldosh Garden"></div>
  <div class="address" id="address">Buxoro shahri, Eshoni Pir ko‘chasi, 11-uy</div>
  <div class="dot">•</div>
  <div class="lang-switch" id="langSwitch" aria-label="Tilni tanlash"><button class="lang-option active" data-lang="uz">UZ</button><button class="lang-option" data-lang="en">EN</button><button class="lang-option" data-lang="ru">RU</button></div>
  <a class="phone" href="tel:+998907124411">+998 90 712 44 11</a>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="content">
    <div class="toolbar">
      <div class="search-wrap"><span>⌕</span><input id="search" placeholder="Search" /></div>
      <button class="filter" id="filterBtn" aria-label="Filter">☷</button>
    </div>
    <div class="heading-row"><h1 id="sectionTitle">Салаты / Salads</h1><span id="count"></span></div>
    <section class="grid" id="grid"></section>
  </main>
</div>

<div class="modal-backdrop" id="backdrop">
 <div class="modal" role="dialog" aria-modal="true">
   <button class="close" id="close">×</button>
   <div class="modal-main">
     <img id="modalImg" src="" alt="">
     <div class="modal-info">
       <h2 id="modalName"></h2>
       <div class="muted">Description</div>
       <p id="modalDesc"></p>
     </div>
   </div>
   <div class="modal-price" id="modalPrice"></div>
 </div>
</div>
<script>
products.forEach((p,i)=>{p.nameRu=p.name;p.descRu=p.desc;p.nameUz=productNames.uz[i];p.nameEn=productNames.en[i]});
const sidebar=document.querySelector('#sidebar'),grid=document.querySelector('#grid'),search=document.querySelector('#search'),count=document.querySelector('#count');
let active='salads',currentLang='uz';
function localizedName(p){return currentLang==='uz'?p.nameUz:currentLang==='en'?p.nameEn:p.nameRu}
function localizedDesc(p){return currentLang==='ru'?p.descRu:ui[currentLang].desc[p.cat]}
function buildSidebar(){sidebar.innerHTML='';categories.forEach(c=>{const el=document.createElement('div');const representative=products.find(p=>p.cat===c[2]);el.className='cat'+(c[2]===active?' active':'');el.innerHTML=`<img src="${representative?productImage(representative):IMAGE_DATA[c[1]]}" alt="${categoryNames[c[2]][currentLang]}"><span>${categoryNames[c[2]][currentLang]}</span>`;el.onclick=()=>{active=c[2];buildSidebar();render()};sidebar.appendChild(el)})}
function productImage(p){return IMAGE_DATA[p.img]||p.img}
function render(){const q=search.value.trim().toLowerCase();const list=products.filter(p=>p.cat===active&&(!q||(`${localizedName(p)} ${localizedDesc(p)} ${p.nameRu}`).toLowerCase().includes(q)));document.querySelector('#sectionTitle').textContent=categoryNames[active][currentLang];grid.innerHTML=list.map(p=>`<article class="card" data-i="${products.indexOf(p)}"><img src="${productImage(p)}" alt="${localizedName(p)}" loading="lazy"><div class="price">${p.price}</div><div class="name">${localizedName(p)}</div><div class="desc">${localizedDesc(p)}</div></article>`).join('');count.textContent=ui[currentLang].count(list.length);document.querySelectorAll('.card').forEach(card=>card.onclick=()=>openModal(products[card.dataset.i]))}
search.addEventListener('input',render);
const backdrop=document.querySelector('#backdrop');
function openModal(p){document.querySelector('#modalImg').src=productImage(p);document.querySelector('#modalName').textContent=localizedName(p);document.querySelector('#modalDesc').textContent=localizedDesc(p);document.querySelector('#modalPrice').textContent=p.price;backdrop.classList.add('open')}
function closeModal(){backdrop.classList.remove('open')}document.querySelector('#close').onclick=closeModal;backdrop.onclick=e=>{if(e.target===backdrop)closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.querySelectorAll('.lang-option').forEach(btn=>btn.onclick=()=>{currentLang=btn.dataset.lang;document.querySelectorAll('.lang-option').forEach(x=>x.classList.toggle('active',x===btn));document.documentElement.lang=currentLang;document.querySelector('#address').textContent=ui[currentLang].address;search.placeholder=ui[currentLang].search;buildSidebar();render()});
document.querySelector('#filterBtn').onclick=()=>search.focus();
search.placeholder=ui[currentLang].search;buildSidebar();render();

</script>
</body>
</html>
